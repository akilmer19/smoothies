<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smoothie Recipes</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'DM Sans', sans-serif;
    background: #f5f2ec;
    color: #2d2a26;
    -webkit-font-smoothing: antialiased;
  }
  .container {
    max-width: 540px;
    margin: 0 auto;
    padding: 28px 16px 60px;
  }
  h1 {
    font-size: 26px;
    font-weight: 800;
    line-height: 1.2;
    color: #2d2a26;
  }
  .subtitle {
    font-size: 14px;
    color: #8a8278;
    margin-top: 6px;
    line-height: 1.5;
  }
  .cards {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-top: 24px;
  }
  .card {
    background: #faf8f4;
    border-radius: 14px;
    overflow: hidden;
    border: 1px solid #ece7df;
    box-shadow: 0 1px 4px rgba(45,42,38,0.04);
    transition: box-shadow 0.2s;
  }
  .card.open {
    box-shadow: 0 4px 20px rgba(45,42,38,0.08);
  }
  .card-header {
    padding: 18px 20px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 14px;
    user-select: none;
    -webkit-user-select: none;
  }
  .card-icon {
    width: 44px;
    height: 44px;
    border-radius: 12px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .card-info { flex: 1; min-width: 0; }
  .card-name {
    font-weight: 700;
    font-size: 16px;
    line-height: 1.3;
    color: #2d2a26;
  }
  .card-desc {
    font-size: 13px;
    color: #8a8278;
    line-height: 1.4;
    margin-top: 2px;
  }
  .card-arrow {
    font-size: 14px;
    color: #b5ab9a;
    transition: transform 0.2s;
    flex-shrink: 0;
  }
  .card.open .card-arrow { transform: rotate(180deg); }
  .badges {
    padding: 0 20px 14px;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .badge {
    font-size: 11.5px;
    font-weight: 600;
    padding: 3px 10px;
    border-radius: 20px;
    white-space: nowrap;
  }
  .badge-protein { color: #4a7c59; background: #e8f0ea; }
  .badge-cal { color: #8a7248; background: #f5efe4; }
  .badge-tag { font-size: 11px; font-weight: 500; color: #7a7570; background: #f0ece6; padding: 3px 9px; }
  .card-body {
    padding: 0 20px 20px;
    border-top: 1px solid #ece7df;
    display: none;
  }
  .card.open .card-body { display: block; }
  .section-label {
    font-size: 12px;
    color: #8a8278;
    font-weight: 600;
    margin-top: 16px;
    margin-bottom: 6px;
    text-transform: uppercase;
    letter-spacing: 0.8px;
  }
  .section-title {
    font-size: 13px;
    font-weight: 700;
    color: #2d2a26;
    margin-top: 14px;
    margin-bottom: 8px;
  }
  .ingredient-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .ingredient {
    font-size: 13px;
    color: #4a4540;
    line-height: 1.5;
    padding-left: 14px;
    position: relative;
  }
  .ingredient .dot {
    position: absolute;
    left: 0;
    top: 7px;
    width: 5px;
    height: 5px;
    border-radius: 50%;
    opacity: 0.5;
  }
  .steps {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-top: 4px;
  }
  .step {
    display: flex;
    gap: 10px;
    align-items: flex-start;
  }
  .step-num {
    width: 22px;
    height: 22px;
    border-radius: 7px;
    color: #faf8f4;
    font-size: 12px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    margin-top: 1px;
  }
  .step-text {
    font-size: 13px;
    color: #4a4540;
    line-height: 1.5;
  }
  .tip-box {
    margin-top: 16px;
    padding: 12px 14px;
    background: #f5f2ec;
    border-radius: 10px;
    border-left: 3px solid;
  }
  .tip-label {
    font-size: 11.5px;
    font-weight: 700;
    color: #6b6560;
    text-transform: uppercase;
    letter-spacing: 0.6px;
  }
  .tip-text {
    font-size: 12.5px;
    color: #5a554f;
    line-height: 1.5;
    margin-top: 4px;
  }
</style>
</head>
<body>
<div class="container">
  <h1>Smoothie Recipes</h1>
  <p class="subtitle">4 rotations using what you have on hand. Tap any card to see the full recipe. All servings are for 2 people.</p>
  <div class="cards" id="cards"></div>
</div>
 
<script>
const SMOOTHIES = [
  {
    name: "Tropical Green",
    desc: "Mango and banana completely mask the spinach \u2014 creamy, tropical, and packed with greens.",
    protein: "~22g", cal: "~310", servings: 2,
    tags: ["Post-Workout", "High Protein"],
    color: "#4a7c59",
    ingredients: [
      "2 cups unsweetened almond milk",
      "2 scoops Vega One (vanilla)",
      "2 big handfuls fresh spinach",
      "1 cup frozen mango chunks",
      "1 frozen banana",
      "2 tsp wild raw honey"
    ],
    steps: [
      "Add almond milk and spinach to the blender first. Blend for 10\u201315 seconds until the spinach is fully broken down \u2014 no chunks.",
      "Add frozen mango, frozen banana, Vega One, and honey.",
      "Blend on high until completely smooth and creamy, about 30\u201345 seconds.",
      "Pour into two glasses and serve immediately."
    ],
    tips: "Use frozen banana for a thick, milkshake-like texture. Fresh banana makes it thinner and less cold."
  },
  {
    name: "Strawberry PB&J Vibe",
    desc: "Walnuts give it a nutty richness that plays off the strawberries almost like a PB&J.",
    protein: "~26g", cal: "~380", servings: 2,
    tags: ["High Protein", "Nutty"],
    color: "#b5434b",
    ingredients: [
      "2 cups unsweetened almond milk",
      "1 cup strawberries (fresh or frozen)",
      "1 frozen banana",
      "1/4 cup walnuts",
      "2 scoops Vega One (vanilla)",
      "2 tsp wild raw honey",
      "2 tbsp green non-fat plain yogurt (optional, for thickness)"
    ],
    steps: [
      "Add almond milk and walnuts to the blender. Blend for 10 seconds to break down the walnuts.",
      "Add strawberries, frozen banana, Vega One, and honey.",
      "Blend on high until smooth, about 30\u201345 seconds.",
      "If you want it thicker and tangier, add yogurt and blend another 10 seconds.",
      "Pour into two glasses and serve."
    ],
    tips: "The walnuts add healthy fats and omega-3s. Blend them first so you don't get gritty chunks."
  },
  {
    name: "Mango Lassi-ish",
    desc: "Tastes like a mango lassi without the heaviness. Yogurt carries the protein here \u2014 skip the Vega One.",
    protein: "~10g", cal: "~260", servings: 2,
    tags: ["Light", "Recovery"],
    color: "#d4913a",
    ingredients: [
      "1.5 cups unsweetened almond milk",
      "1/2 cup green non-fat plain yogurt",
      "1 cup frozen mango chunks",
      "1 fresh banana",
      "2 tsp wild raw honey",
      "2 tbsp coconut flakes (for topping)"
    ],
    steps: [
      "Add almond milk, yogurt, frozen mango, banana, and honey to the blender.",
      "Blend on high until completely smooth, about 30 seconds.",
      "Pour into two glasses.",
      "Sprinkle coconut flakes on top for crunch and serve."
    ],
    tips: "No Vega One in this one \u2014 the yogurt keeps it lighter and the flavor cleaner. Great as a lighter option on rest days."
  },
  {
    name: "Power Green",
    desc: "The densest of the bunch \u2014 almonds add texture and healthy fats, banana and honey keep it from tasting like lawn clippings.",
    protein: "~28g", cal: "~420", servings: 2,
    tags: ["Post-Workout", "High Protein", "Dense"],
    color: "#3d6b4f",
    ingredients: [
      "2 cups unsweetened almond milk",
      "2 scoops Vega One (vanilla)",
      "2 big handfuls fresh spinach",
      "1 frozen banana",
      "1/4 cup almonds",
      "4 tbsp green non-fat plain yogurt",
      "2 tsp wild raw honey"
    ],
    steps: [
      "Add almond milk, almonds, and spinach to the blender. Blend 15 seconds until spinach is broken down and almonds are pulverized.",
      "Add frozen banana, yogurt, Vega One, and honey.",
      "Blend on high until thick and smooth, about 45 seconds.",
      "Pour into two glasses and serve immediately."
    ],
    tips: "This is the heaviest one \u2014 great after lifting. If it\u2019s too earthy from the Vega One, bump the honey up to 1 tbsp each."
  }
];
 
const svgIcon = `<svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M5 3h14l-1.5 15a2 2 0 01-2 1.8H8.5a2 2 0 01-2-1.8L5 3z" stroke="#faf8f4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M8 3V2M12 3V1M16 3V2" stroke="#faf8f4" stroke-width="1.8" stroke-linecap="round"/><path d="M9 8c1 2 5 2 6 0" stroke="#faf8f4" stroke-width="1.5" stroke-linecap="round"/></svg>`;
 
function renderCards() {
  const container = document.getElementById('cards');
  container.innerHTML = SMOOTHIES.map((s, i) => `
    <div class="card" id="card-${i}" onclick="toggle(${i})">
      <div class="card-header">
        <div class="card-icon" style="background:${s.color}">${svgIcon}</div>
        <div class="card-info">
          <div class="card-name">${s.name}</div>
          <div class="card-desc">${s.desc}</div>
        </div>
        <span class="card-arrow">&#9660;</span>
      </div>
      <div class="badges">
        <span class="badge badge-protein">${s.protein} protein / person</span>
        <span class="badge badge-cal">${s.cal} / person</span>
        ${s.tags.map(t => `<span class="badge badge-tag">${t}</span>`).join('')}
      </div>
      <div class="card-body">
        <div class="section-label">Makes ${s.servings} servings</div>
        <div class="section-title">Ingredients</div>
        <div class="ingredient-list">
          ${s.ingredients.map(ing => `
            <div class="ingredient">
              <span class="dot" style="background:${s.color}"></span>
              ${ing}
            </div>
          `).join('')}
        </div>
        <div class="section-title" style="margin-top:18px">Steps</div>
        <div class="steps">
          ${s.steps.map((step, j) => `
            <div class="step">
              <div class="step-num" style="background:${s.color}">${j + 1}</div>
              <span class="step-text">${step}</span>
            </div>
          `).join('')}
        </div>
        ${s.tips ? `
        <div class="tip-box" style="border-left-color:${s.color}">
          <div class="tip-label">Tip</div>
          <div class="tip-text">${s.tips}</div>
        </div>` : ''}
      </div>
    </div>
  `).join('');
}
 
function toggle(idx) {
  const card = document.getElementById('card-' + idx);
  const wasOpen = card.classList.contains('open');
  document.querySelectorAll('.card').forEach(c => c.classList.remove('open'));
  if (!wasOpen) card.classList.add('open');
}
 
renderCards();
</script>
</body>
</html>
